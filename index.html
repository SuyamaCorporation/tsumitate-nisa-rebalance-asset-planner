<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>積立NISA リバランス資産配分プランナー</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .deviation-pos { color: #15803d; }
  .deviation-neg { color: #dc2626; }
  .deviation-ok { color: #374151; }
</style>
</head>
<body class="bg-blue-50 min-h-screen">

<header class="bg-blue-900 text-white py-4 px-4 shadow-md">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold">📊 積立NISA リバランス資産配分プランナー</h1>
    <p class="text-blue-200 text-sm mt-1">目標配分と現在残高から追加購入比率を提案</p>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

  <!-- 免責 -->
  <div class="bg-yellow-50 border border-yellow-300 rounded-xl p-3 text-sm text-yellow-800" role="note">
    ⚠️ 投資は元本割れリスクがあります。このアプリの計算は参考情報のみです。投資判断はご自身の責任で行ってください。
  </div>

  <!-- 資産入力テーブル -->
  <section class="bg-white rounded-xl shadow-sm p-5">
    <h2 class="font-bold text-blue-900 text-lg mb-4">資産クラス入力</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-blue-900 text-white">
            <th class="text-left p-3 rounded-tl-lg">資産クラス</th>
            <th class="text-right p-3">目標比率（%）</th>
            <th class="text-right p-3 rounded-tr-lg">現在評価額（円）</th>
          </tr>
        </thead>
        <tbody id="asset-tbody"></tbody>
        <tfoot>
          <tr class="border-t-2 border-blue-200 bg-blue-50">
            <td class="p-3 font-bold text-blue-900">合計</td>
            <td class="p-3 text-right font-bold" id="total-ratio">0%</td>
            <td class="p-3 text-right font-bold" id="total-value">¥0</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p id="ratio-warning" class="text-red-600 text-xs mt-2 hidden">⚠️ 目標比率の合計が100%になるよう設定してください</p>

    <!-- 月額積立 -->
    <div class="mt-4 flex items-center gap-3">
      <label for="monthly-input" class="text-sm font-semibold text-blue-900 whitespace-nowrap">月額積立額</label>
      <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden flex-1">
        <span class="bg-gray-100 px-3 py-2 text-sm text-gray-600">¥</span>
        <input type="number" id="monthly-input" class="flex-1 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="33333" min="0" aria-label="月額積立額（円）">
      </div>
    </div>

    <div class="mt-3 flex gap-3">
      <button id="calc-btn" class="flex-1 bg-blue-800 text-white py-3 rounded-xl font-bold hover:bg-blue-900 transition">
        計算する
      </button>
      <button id="save-btn" class="bg-green-700 text-white px-4 py-3 rounded-xl font-bold hover:bg-green-800 transition text-sm">
        保存
      </button>
      <button id="load-btn" class="bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold hover:bg-gray-300 transition text-sm">
        読込
      </button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="results-section" class="hidden space-y-5">

    <!-- ドーナツチャート -->
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="font-bold text-blue-900 text-lg mb-4">配分比較</h2>
      <div class="flex flex-col sm:flex-row gap-6 justify-center items-center">
        <div class="text-center">
          <p class="text-xs text-gray-500 mb-2 font-semibold">現在の配分</p>
          <svg id="donut-current" viewBox="0 0 120 120" width="140" height="140" aria-label="現在の資産配分ドーナツチャート" role="img"></svg>
        </div>
        <div id="chart-legend" class="flex flex-col gap-2 text-sm"></div>
        <div class="text-center">
          <p class="text-xs text-gray-500 mb-2 font-semibold">目標配分</p>
          <svg id="donut-target" viewBox="0 0 120 120" width="140" height="140" aria-label="目標の資産配分ドーナツチャート" role="img"></svg>
        </div>
      </div>
    </div>

    <!-- 乖離率テーブル -->
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="font-bold text-blue-900 text-lg mb-4">乖離率・追加購入推奨</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-blue-900 text-white">
              <th class="text-left p-3">資産クラス</th>
              <th class="text-right p-3">現在%</th>
              <th class="text-right p-3">目標%</th>
              <th class="text-right p-3">乖離%</th>
              <th class="text-right p-3">月額推奨</th>
            </tr>
          </thead>
          <tbody id="deviation-tbody"></tbody>
        </table>
      </div>
      <div class="mt-3 bg-blue-50 rounded-lg p-3">
        <p class="text-sm font-semibold text-blue-900">リバランス完了予測</p>
        <p id="rebalance-estimate" class="text-sm text-blue-700 mt-1"></p>
      </div>
    </div>

    <!-- 資産成長予測 -->
    <div class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="font-bold text-blue-900 text-lg mb-4">📈 資産成長予測</h2>
      <div class="flex items-center gap-3 mb-4">
        <label for="return-rate" class="text-sm font-semibold text-blue-900 whitespace-nowrap">想定年利回り</label>
        <div class="flex items-center border border-gray-300 rounded-lg overflow-hidden">
          <input type="number" id="return-rate" class="w-16 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="5" min="0" max="20" step="0.5" aria-label="想定年利回り（%）">
          <span class="bg-gray-100 px-3 py-2 text-sm text-gray-600">%</span>
        </div>
        <button id="project-btn" class="bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-800 transition">更新</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-blue-900 text-white">
              <th class="text-left p-3">年数</th>
              <th class="text-right p-3">元本累計</th>
              <th class="text-right p-3">予測評価額</th>
              <th class="text-right p-3">運用益</th>
            </tr>
          </thead>
          <tbody id="projection-tbody"></tbody>
        </table>
      </div>
      <!-- バーチャート -->
      <div id="bar-chart" class="mt-4 space-y-2"></div>
    </div>

  </section>

</main>

<script>
// ===== データ =====
const ASSETS = [
  { id: 'domestic', label: '国内株式', color: '#3b82f6' },
  { id: 'foreign', label: '外国株式', color: '#10b981' },
  { id: 'bond', label: '国内債券', color: '#f59e0b' },
  { id: 'reit', label: 'REIT', color: '#8b5cf6' },
];

const PROJECTION_YEARS = [10, 20, 30];

// ===== ローカルストレージ =====
const LS_KEY = 'nisa-planner-data';

// ===== テーブル構築 =====
function buildAssetTable() {
  const tbody = document.getElementById('asset-tbody');
  ASSETS.forEach(asset => {
    const tr = document.createElement('tr');
    tr.className = 'border-t border-gray-200';

    const tdName = document.createElement('td');
    tdName.className = 'p-3';
    const dot = document.createElement('span');
    dot.className = 'inline-block w-3 h-3 rounded-full mr-2';
    dot.style.backgroundColor = asset.color;
    tdName.appendChild(dot);
    tdName.appendChild(document.createTextNode(asset.label));

    const tdRatio = document.createElement('td');
    tdRatio.className = 'p-3 text-right';
    const ratioInput = document.createElement('input');
    ratioInput.type = 'number';
    ratioInput.id = 'ratio-' + asset.id;
    ratioInput.className = 'w-16 border border-gray-300 rounded px-2 py-1 text-right focus:outline-none focus:ring-2 focus:ring-blue-400';
    ratioInput.min = 0; ratioInput.max = 100; ratioInput.value = 25;
    ratioInput.setAttribute('aria-label', asset.label + 'の目標比率（%）');
    ratioInput.addEventListener('input', updateTotals);
    tdRatio.appendChild(ratioInput);
    tdRatio.appendChild(document.createTextNode(' %'));

    const tdValue = document.createElement('td');
    tdValue.className = 'p-3 text-right';
    const valueInput = document.createElement('input');
    valueInput.type = 'number';
    valueInput.id = 'value-' + asset.id;
    valueInput.className = 'w-28 border border-gray-300 rounded px-2 py-1 text-right focus:outline-none focus:ring-2 focus:ring-blue-400';
    valueInput.min = 0; valueInput.value = 0;
    valueInput.setAttribute('aria-label', asset.label + 'の現在評価額（円）');
    valueInput.addEventListener('input', updateTotals);
    tdValue.appendChild(valueInput);

    tr.appendChild(tdName);
    tr.appendChild(tdRatio);
    tr.appendChild(tdValue);
    tbody.appendChild(tr);
  });
}

function updateTotals() {
  let totalRatio = 0, totalValue = 0;
  ASSETS.forEach(asset => {
    totalRatio += parseFloat(document.getElementById('ratio-' + asset.id).value || 0);
    totalValue += parseFloat(document.getElementById('value-' + asset.id).value || 0);
  });
  document.getElementById('total-ratio').textContent = totalRatio.toFixed(0) + '%';
  document.getElementById('total-value').textContent = '¥' + totalValue.toLocaleString('ja-JP');
  const warn = document.getElementById('ratio-warning');
  warn.classList.toggle('hidden', Math.abs(totalRatio - 100) < 0.5);
}

// ===== ドーナツチャート =====
function drawDonut(svgId, segments) {
  const svg = document.getElementById(svgId);
  svg.innerHTML = '';
  const cx = 60, cy = 60, r = 45, innerR = 28;
  let startAngle = -Math.PI / 2;
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  if (total === 0) return;

  segments.forEach(seg => {
    const fraction = seg.value / total;
    const angle = fraction * 2 * Math.PI;
    const endAngle = startAngle + angle;

    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);
    const ix1 = cx + innerR * Math.cos(startAngle);
    const iy1 = cy + innerR * Math.sin(startAngle);
    const ix2 = cx + innerR * Math.cos(endAngle);
    const iy2 = cy + innerR * Math.sin(endAngle);
    const largeArc = angle > Math.PI ? 1 : 0;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix1} ${iy1} Z`);
    path.setAttribute('fill', seg.color);
    path.setAttribute('opacity', '0.9');
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = seg.label + ': ' + (fraction * 100).toFixed(1) + '%';
    path.appendChild(title);
    svg.appendChild(path);
    startAngle = endAngle;
  });

  // 中央テキスト
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', cx);
  text.setAttribute('y', cy + 5);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('font-size', '10');
  text.setAttribute('fill', '#374151');
  text.textContent = '配分';
  svg.appendChild(text);
}

function buildLegend() {
  const legend = document.getElementById('chart-legend');
  legend.innerHTML = '';
  ASSETS.forEach(asset => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    const dot = document.createElement('span');
    dot.className = 'w-3 h-3 rounded-full flex-shrink-0';
    dot.style.backgroundColor = asset.color;
    const lbl = document.createElement('span');
    lbl.className = 'text-xs text-gray-700';
    lbl.textContent = asset.label;
    row.appendChild(dot);
    row.appendChild(lbl);
    legend.appendChild(row);
  });
}

// ===== 計算 =====
function calculate() {
  const data = getInputData();
  if (!data) return;

  const { ratios, values, monthly, totalValue } = data;

  // 現在の実際配分%
  const currentPct = ASSETS.map((_, i) => totalValue > 0 ? (values[i] / totalValue) * 100 : 0);

  // ドーナツ
  const currentSegs = ASSETS.map((a, i) => ({ label: a.label, value: values[i], color: a.color }));
  const targetSegs = ASSETS.map((a, i) => ({ label: a.label, value: ratios[i], color: a.color }));
  drawDonut('donut-current', currentSegs);
  drawDonut('donut-target', targetSegs);
  buildLegend();

  // 乖離テーブル + 月額推奨
  const tbody = document.getElementById('deviation-tbody');
  tbody.innerHTML = '';

  // 月額配分: 乖離が大きいものに重点配分
  const deviations = ASSETS.map((_, i) => ratios[i] - currentPct[i]);
  const totalPositiveDev = deviations.reduce((s, d) => s + Math.max(0, d), 0);
  const monthlyAllocations = deviations.map(d => {
    if (totalPositiveDev <= 0) return monthly / ASSETS.length;
    return totalPositiveDev > 0 ? (Math.max(0, d) / totalPositiveDev) * monthly : 0;
  });

  let maxMonthsToBalance = 0;

  ASSETS.forEach((asset, i) => {
    const tr = document.createElement('tr');
    tr.className = i % 2 === 0 ? 'bg-white' : 'bg-blue-50';

    const dev = deviations[i];
    const devClass = dev > 1 ? 'deviation-neg' : dev < -1 ? 'deviation-pos' : 'deviation-ok';
    const devSign = dev > 0 ? '+' : '';

    // 完了予測
    if (dev > 0 && monthlyAllocations[i] > 0) {
      const needed = (dev / 100) * totalValue;
      const months = Math.ceil(needed / monthlyAllocations[i]);
      maxMonthsToBalance = Math.max(maxMonthsToBalance, months);
    }

    const cells = [
      { text: asset.label, cls: 'p-3 font-medium text-gray-800' },
      { text: currentPct[i].toFixed(1) + '%', cls: 'p-3 text-right' },
      { text: ratios[i].toFixed(1) + '%', cls: 'p-3 text-right' },
      { text: devSign + dev.toFixed(1) + '%', cls: 'p-3 text-right font-bold ' + devClass },
      { text: '¥' + Math.round(monthlyAllocations[i]).toLocaleString('ja-JP'), cls: 'p-3 text-right' },
    ];

    cells.forEach(cell => {
      const td = document.createElement('td');
      td.className = cell.cls;
      td.textContent = cell.text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  const estimateEl = document.getElementById('rebalance-estimate');
  if (totalValue === 0) {
    estimateEl.textContent = '現在評価額を入力してください。';
  } else if (maxMonthsToBalance === 0) {
    estimateEl.textContent = '現在の配分は目標に近い状態です。積立を継続してください。';
  } else {
    const years = Math.floor(maxMonthsToBalance / 12);
    const months = maxMonthsToBalance % 12;
    estimateEl.textContent = `目標配分達成の目安: 約${years > 0 ? years + '年' : ''}${months > 0 ? months + 'ヶ月' : ''}（月額 ¥${monthly.toLocaleString('ja-JP')} の場合）`;
  }

  // 成長予測
  buildProjection(totalValue, monthly);

  document.getElementById('results-section').classList.remove('hidden');
  document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildProjection(currentValue, monthly, returnRate) {
  if (returnRate === undefined) {
    returnRate = parseFloat(document.getElementById('return-rate').value) / 100;
  }

  const tbody = document.getElementById('projection-tbody');
  tbody.innerHTML = '';
  const barChart = document.getElementById('bar-chart');
  barChart.innerHTML = '';

  const rows = [];
  PROJECTION_YEARS.forEach(years => {
    const principal = currentValue + monthly * 12 * years;
    // 複利計算（月次積立）
    const monthlyRate = returnRate / 12;
    const months = years * 12;
    let futureValue = currentValue * Math.pow(1 + monthlyRate, months);
    if (monthlyRate > 0) {
      futureValue += monthly * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
    } else {
      futureValue += monthly * months;
    }
    const profit = futureValue - principal;
    rows.push({ years, principal, futureValue, profit });
  });

  const maxVal = Math.max(...rows.map(r => r.futureValue));

  rows.forEach(row => {
    const tr = document.createElement('tr');
    tr.className = 'border-t border-gray-200';

    const cells = [
      { text: row.years + '年後', cls: 'p-3 font-bold text-blue-900' },
      { text: '¥' + Math.round(row.principal).toLocaleString('ja-JP'), cls: 'p-3 text-right text-gray-700' },
      { text: '¥' + Math.round(row.futureValue).toLocaleString('ja-JP'), cls: 'p-3 text-right font-bold text-blue-800' },
      { text: '+¥' + Math.round(row.profit).toLocaleString('ja-JP'), cls: 'p-3 text-right text-green-700 font-bold' },
    ];
    cells.forEach(c => {
      const td = document.createElement('td');
      td.className = c.cls;
      td.textContent = c.text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    // バー
    const barRow = document.createElement('div');
    barRow.className = 'space-y-1';
    const lbl = document.createElement('p');
    lbl.className = 'text-xs font-bold text-blue-900';
    lbl.textContent = row.years + '年後';
    barRow.appendChild(lbl);

    const barWrap = document.createElement('div');
    barWrap.className = 'relative h-6 bg-gray-200 rounded-full overflow-hidden';

    const principalBar = document.createElement('div');
    principalBar.className = 'absolute top-0 left-0 h-full bg-blue-400 transition-all';
    principalBar.style.width = ((row.principal / maxVal) * 100) + '%';
    principalBar.setAttribute('aria-label', '元本 ¥' + Math.round(row.principal).toLocaleString('ja-JP'));

    const totalBar = document.createElement('div');
    totalBar.className = 'absolute top-0 left-0 h-full bg-green-400 opacity-50 transition-all';
    totalBar.style.width = ((row.futureValue / maxVal) * 100) + '%';
    totalBar.setAttribute('aria-label', '予測評価額 ¥' + Math.round(row.futureValue).toLocaleString('ja-JP'));

    barWrap.appendChild(totalBar);
    barWrap.appendChild(principalBar);
    barRow.appendChild(barWrap);

    const barLbls = document.createElement('div');
    barLbls.className = 'flex gap-4 text-xs text-gray-500';
    const lbl1 = document.createElement('span');
    lbl1.className = 'flex items-center gap-1';
    lbl1.innerHTML = '<span class="inline-block w-3 h-3 rounded-sm bg-blue-400"></span>';
    lbl1.appendChild(document.createTextNode('元本 ¥' + Math.round(row.principal / 10000).toLocaleString('ja-JP') + '万'));
    const lbl2 = document.createElement('span');
    lbl2.className = 'flex items-center gap-1';
    lbl2.innerHTML = '<span class="inline-block w-3 h-3 rounded-sm bg-green-400 opacity-50"></span>';
    lbl2.appendChild(document.createTextNode('評価額 ¥' + Math.round(row.futureValue / 10000).toLocaleString('ja-JP') + '万'));
    barLbls.appendChild(lbl1);
    barLbls.appendChild(lbl2);
    barRow.appendChild(barLbls);
    barChart.appendChild(barRow);
  });
}

function getInputData() {
  const ratios = ASSETS.map(a => parseFloat(document.getElementById('ratio-' + a.id).value || 0));
  const values = ASSETS.map(a => parseFloat(document.getElementById('value-' + a.id).value || 0));
  const monthly = parseFloat(document.getElementById('monthly-input').value || 0);
  const totalRatio = ratios.reduce((s, r) => s + r, 0);
  const totalValue = values.reduce((s, v) => s + v, 0);
  if (Math.abs(totalRatio - 100) > 1) {
    document.getElementById('ratio-warning').classList.remove('hidden');
    return null;
  }
  return { ratios, values, monthly, totalValue };
}

// ===== 保存/読込 =====
function saveData() {
  const ratios = ASSETS.map(a => document.getElementById('ratio-' + a.id).value);
  const values = ASSETS.map(a => document.getElementById('value-' + a.id).value);
  const monthly = document.getElementById('monthly-input').value;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ ratios, values, monthly }));
    alert('保存しました。');
  } catch { alert('保存に失敗しました。'); }
}

function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (!d) { alert('保存データがありません。'); return; }
    ASSETS.forEach((a, i) => {
      document.getElementById('ratio-' + a.id).value = d.ratios[i] || 0;
      document.getElementById('value-' + a.id).value = d.values[i] || 0;
    });
    document.getElementById('monthly-input').value = d.monthly || 0;
    updateTotals();
    alert('読み込みました。');
  } catch { alert('読み込みに失敗しました。'); }
}

// ===== 初期化 =====
buildAssetTable();
updateTotals();

document.getElementById('calc-btn').addEventListener('click', calculate);
document.getElementById('save-btn').addEventListener('click', saveData);
document.getElementById('load-btn').addEventListener('click', loadData);
document.getElementById('project-btn').addEventListener('click', () => {
  const data = getInputData();
  if (!data) return;
  const rate = parseFloat(document.getElementById('return-rate').value) / 100;
  buildProjection(data.totalValue, data.monthly, rate);
});
</script>
</body>
</html>
